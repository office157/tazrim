<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://chzoulucwbhvulgopuah.supabase.co https://api.resend.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data:; font-src 'self';"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="pavicon.png"/>
<meta name="description" content="תזרים — ניהול תזרים מזומנים | Tactigo"/>
<title>תזרים | Tactigo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@font-face {
  font-family:'FbEinstein';
  src:url('FbEinstein-Regular.otf') format('opentype');
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'FbEinstein','Segoe UI',sans-serif;direction:rtl}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
:root{--teal:#00AECC;--navy:#0D1B4B;--green:#10B981;--orange:#F97316;--red:#EF4444}
/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#07112B}::-webkit-scrollbar-thumb{background:#00AECC33;border-radius:3px}
select,select.modal-input,select.form-input,select.edit-input{background:#fff!important;color:#111!important;border:1px solid rgba(0,0,0,.15)!important}
select option{background:#fff;color:#111}
/* Glass */
.glass{background:rgba(13,27,75,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,174,204,0.18);box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.07)}
.glass-income{background:rgba(16,185,129,0.1);backdrop-filter:blur(20px);border:1px solid rgba(16,185,129,0.35);box-shadow:0 0 40px rgba(16,185,129,0.12)}
.glass-expense{background:rgba(249,115,22,0.1);backdrop-filter:blur(20px);border:1px solid rgba(249,115,22,0.35);box-shadow:0 0 40px rgba(249,115,22,0.12)}
/* Animations */
@keyframes fadeIn{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shrink{from{width:100%}to{width:0}}
.anim-fade{animation:fadeIn .22s ease-out forwards}
.anim-up{animation:slideUp .28s ease-out forwards}
/* Layout */
#app{min-height:100vh}
/* ===== LOADER ===== */
#loader{display:flex;align-items:center;justify-content:center;min-height:100vh}
.spinner{width:44px;height:44px;border:2px solid #00AECC;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.login-logo{display:flex;justify-content:center;margin-bottom:28px}
.login-logo img{height:44px}
.login-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{text-align:center;color:rgba(255,255,255,.35);font-size:13px;margin-bottom:28px}
.form-label{color:rgba(255,255,255,.5);font-size:13px;display:block;margin-bottom:6px}
.form-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;color:#fff;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:14px}
.form-input:focus{border-color:rgba(0,174,204,.5)}
.btn-primary{width:100%;background:var(--teal);color:#07112B;font-weight:700;font-size:15px;padding:14px;border:none;border-radius:12px;cursor:pointer;transition:background .2s;margin-bottom:10px}
.btn-primary:hover{background:#00C8EB}
.btn-secondary{width:100%;background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);font-size:13px;padding:12px;border-radius:12px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{border-color:rgba(0,174,204,.4);color:#fff}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#FCA5A5;border-radius:10px;padding:10px 14px;font-size:13px;text-align:center;margin-bottom:12px}
/* ===== HEADER ===== */
#header{position:sticky;top:0;z-index:30;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,17,43,.88);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05)}
.header-logo img{height:36px}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-add{display:flex;align-items:center;gap:6px;background:var(--teal);color:#07112B;font-weight:700;font-size:13px;padding:10px 18px;border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 18px rgba(0,174,204,.28);transition:all .2s}
.btn-add:hover{background:#00C8EB;box-shadow:0 0 28px rgba(0,174,204,.45)}
.btn-import{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--teal);color:var(--teal);font-weight:600;font-size:13px;padding:9px 16px;border-radius:12px;cursor:pointer;transition:all .2s}
.btn-import:hover{background:rgba(0,174,204,.1)}
/* Import Modal */
.import-zone{border:2px dashed var(--border);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.import-zone:hover,.import-zone.drag-over{border-color:var(--teal);background:rgba(0,174,204,.06)}
.import-zone-text{color:var(--text-dim);font-size:14px;line-height:1.8}
.import-zone-text strong{color:var(--teal)}
.import-preview{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.import-table{width:100%;border-collapse:collapse;font-size:13px}
.import-table th{padding:8px 10px;text-align:right;font-size:11px;color:var(--text-dim);background:rgba(0,174,204,.06);position:sticky;top:0;z-index:1}
.import-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.import-table tr.row-error td{background:rgba(239,68,68,.08);color:var(--red)}
.import-table tr.row-ok td{color:var(--text)}
.import-stats{display:flex;gap:16px;justify-content:center;margin-bottom:14px;font-size:14px}
.import-stats .stat-ok{color:var(--green);font-weight:600}
.import-stats .stat-err{color:var(--red);font-weight:600}
.import-default-bank{margin-bottom:14px}
.import-default-bank label{font-size:13px;color:var(--text-dim);margin-left:8px}
.import-default-bank select{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:7px 12px;color:var(--text);font-size:13px;outline:none}

.btn-logout{background:transparent;border:none;color:rgba(255,255,255,.3);font-size:13px;cursor:pointer;transition:color .2s;padding:8px 12px}
.btn-logout:hover{color:rgba(255,255,255,.7)}
/* ===== MAIN ===== */
#main{max-width:1100px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:22px}
/* ===== HERO CARDS ===== */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media(max-width:640px){.hero-grid{grid-template-columns:1fr}}



.hero-value{font-size:44px;font-weight:700;line-height:1.1}

.balance-edit-icon{color:rgba(255,255,255,.2);font-size:18px;margin-right:8px;cursor:pointer;transition:color .2s;vertical-align:middle}
.balance-edit-icon:hover{color:var(--teal)}
.balance-edit-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.balance-input{background:rgba(255,255,255,.08);border:1px solid rgba(0,174,204,.4);border-radius:12px;padding:10px 14px;color:#fff;font-size:28px;font-weight:700;outline:none;width:200px;transition:border-color .2s}
.balance-input:focus{border-color:var(--teal)}
.btn-save{background:var(--teal);color:#07112B;border:none;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-cancel{background:transparent;border:none;color:rgba(255,255,255,.35);cursor:pointer;font-size:20px;padding:8px}
/* ===== TABLE CARD ===== */
.table-card{border-radius:18px;overflow:clip}
.table-header{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between}
.table-title{font-weight:700;font-size:16px}
.table-count{color:rgba(255,255,255,.28);font-size:13px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:right;font-size:11px;color:rgba(255,255,255,.28);font-weight:400;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px;vertical-align:middle}
.tbl tr.tx-row{cursor:pointer;transition:background .15s}
.tbl tr.tx-row:hover{background:rgba(255,255,255,.03)}
.tbl tr.tx-row.selected{background:rgba(255,255,255,.05)}
.tbl tr:last-child td{border-bottom:none}
.empty-state{padding:48px;text-align:center;color:rgba(255,255,255,.18);font-size:14px}
/* badges */
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.badge-income{background:rgba(16,185,129,.12);color:#34D399}
.badge-expense{background:rgba(249,115,22,.12);color:#FB923C}
.badge-recurring{background:rgba(0,174,204,.1);color:#67E8F9;font-size:10px}
.check-btn{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.check-btn:hover{border-color:var(--teal)}
.del-btn{background:transparent;border:none;color:rgba(255,255,255,.18);cursor:pointer;font-size:15px;padding:4px 8px;transition:color .15s;border-radius:6px}
.del-btn:hover{color:var(--red);background:rgba(239,68,68,.1)}
/* running balance */
.bal-neg{color:var(--red);font-weight:700}
.bal-pos{color:rgba(255,255,255,.75)}
.td-dim{color:rgba(255,255,255,.45)}
/* ===== EDIT ROW ===== */
.edit-row td{padding:4px 14px 14px}
.edit-card{border-radius:14px;padding:16px 18px}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.edit-label{color:rgba(255,255,255,.38);font-size:11px;display:block;margin-bottom:4px}
.edit-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;outline:none}
.edit-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.type-toggle-btn{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid;cursor:pointer;background:transparent;transition:all .2s}
.btn-save-sm{background:rgba(0,174,204,.8);color:#07112B;border:none;font-weight:700;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-save-sm:hover{background:var(--teal)}
.btn-cancel-sm{background:transparent;border:none;color:rgba(255,255,255,.3);font-size:13px;cursor:pointer;padding:8px 12px}
/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(4,11,30,.82);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{width:100%;max-width:460px;border-radius:24px;overflow:clip;margin:auto}
.type-toggle{display:flex;border-bottom:1px solid rgba(255,255,255,.07)}
.type-btn{flex:1;padding:16px;font-size:16px;font-weight:700;border:none;background:transparent;color:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.type-btn.active-expense{background:rgba(249,115,22,.28);color:#fff}
.type-btn.active-income{background:rgba(16,185,129,.28);color:#fff}
.modal-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.modal-label{color:rgba(255,255,255,.45);font-size:13px;display:block;margin-bottom:5px}
.modal-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
.modal-input:focus{border-color:rgba(0,174,204,.45)}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-input{font-size:22px;font-weight:700}
.recurring-toggle{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;cursor:pointer;transition:all .2s;user-select:none}
.recurring-toggle:hover{border-color:rgba(255,255,255,.2)}
.chk-box{width:20px;height:20px;border:2px solid rgba(255,255,255,.28);border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.chk-box.checked{background:var(--teal);border-color:var(--teal)}
.chk-label{color:rgba(255,255,255,.6);font-size:14px}
.months-row{display:flex;align-items:center;gap:10px;padding:0 4px}
.months-input{width:80px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px;color:#fff;text-align:center;font-size:15px;outline:none}
.modal-actions{display:flex;gap:10px;margin-top:4px;position:relative;z-index:1}
.btn-modal-cancel{flex:1;background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);padding:13px;border-radius:12px;cursor:pointer;font-size:14px;transition:all .2s}
.btn-modal-cancel:hover{border-color:rgba(255,255,255,.2);color:#fff}
.btn-modal-confirm{flex:2;border:none;font-weight:700;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;transition:all .2s}
/* ===== NOTIFICATION ===== */
#notif{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:60;min-width:320px;max-width:480px;border-radius:18px;padding:18px 24px;text-align:center;backdrop-filter:blur(20px)}
.notif-title{font-weight:700;font-size:16px;margin-bottom:4px}
.notif-sub{color:rgba(255,255,255,.55);font-size:13px}
.notif-bar-wrap{margin-top:12px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.notif-bar{height:3px;border-radius:2px;animation:shrink 5s linear forwards}
/* ===== SEARCH BAR ===== */
.search-wrap{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:14px}
.search-input{flex:1;background:transparent;border:none;color:#fff;font-size:14px;outline:none;min-width:0}
.search-input::placeholder{color:rgba(255,255,255,.28)}
.search-clear{background:transparent;border:none;color:rgba(255,255,255,.35);cursor:pointer;font-size:17px;padding:2px 6px;border-radius:6px;line-height:1;transition:color .15s;flex-shrink:0}
.search-clear:hover{color:#fff}
.search-icon{color:rgba(255,255,255,.3);font-size:15px;flex-shrink:0}

/* ===== THEME VARIABLES ===== */
:root{--bg:#07112B;--bg2:#0D1B4B;--text:#fff;--text-dim:rgba(255,255,255,.35);--text-mid:rgba(255,255,255,.55);--border:rgba(255,255,255,.1);--glass-bg:rgba(13,27,75,0.6);--glass-border:rgba(0,174,204,0.18);--shadow:rgba(0,0,0,0.4);--card-hover:rgba(255,255,255,.03);--input-bg:rgba(255,255,255,.06)}
[data-theme="light"]{--bg:#f0f2f5;--bg2:#e4e7ec;--text:#1a1a2e;--text-dim:rgba(0,0,0,.4);--text-mid:rgba(0,0,0,.55);--border:rgba(0,0,0,.1);--glass-bg:rgba(255,255,255,0.75);--glass-border:rgba(0,174,204,0.25);--shadow:rgba(0,0,0,0.08);--card-hover:rgba(0,0,0,.03);--input-bg:rgba(0,0,0,.04)}
[data-theme="light"] .glass{background:var(--glass-bg);border-color:var(--glass-border);box-shadow:0 8px 32px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.5)}
[data-theme="light"] .glass-income{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3)}
[data-theme="light"] .glass-expense{background:rgba(249,115,22,0.08);border-color:rgba(249,115,22,0.3)}
[data-theme="light"] body{color:var(--text)}
[data-theme="light"] .form-input,[data-theme="light"] .modal-input,[data-theme="light"] .edit-input{color:var(--text);background:var(--input-bg)}
[data-theme="light"] .search-wrap .search-input{color:var(--text);background:transparent}
[data-theme="light"] .form-input::placeholder,[data-theme="light"] .modal-input::placeholder,[data-theme="light"] .search-input::placeholder{color:var(--text-dim)}
[data-theme="light"] .tbl td,[data-theme="light"] .tbl th{color:var(--text)}
[data-theme="light"] .balance-input{color:var(--text);background:var(--input-bg)}
[data-theme="light"] .login-title,[data-theme="light"] .login-sub{color:var(--text)}
[data-theme="light"] .error-msg{color:#dc2626}
[data-theme="light"] #notif{color:var(--text)}
/* Theme toggle */
.theme-toggle{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
.theme-toggle:hover{border-color:var(--teal);color:#fff}
[data-theme="light"] .theme-toggle{border-color:rgba(0,0,0,.15);color:rgba(0,0,0,.5)}
[data-theme="light"] .theme-toggle:hover{color:#000}
/* ===== ONBOARDING ===== */
.onboard-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at top,#0D1B4B 0%,#07112B 60%)}
[data-theme="light"] .onboard-page{background:radial-gradient(ellipse at top,#e4e7ec 0%,#f0f2f5 60%)}
.onboard-card{width:100%;max-width:680px;padding:40px 36px;border-radius:24px}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
@media(max-width:540px){.plan-grid{grid-template-columns:1fr}}
.plan-box{border-radius:18px;padding:24px;cursor:pointer;transition:all .25s;border:2px solid transparent;text-align:center}
.plan-box:hover{transform:translateY(-2px)}
.plan-box.selected{border-color:var(--teal);box-shadow:0 0 30px rgba(0,174,204,.2)}
.plan-name{font-size:22px;font-weight:700;margin-bottom:4px}
.plan-price{font-size:28px;font-weight:700;color:var(--teal);margin:12px 0}
.plan-price small{font-size:14px;font-weight:400;color:var(--text-dim)}
.plan-feat{color:var(--text-mid);font-size:13px;line-height:1.8;text-align:right;list-style:none;padding:0}
.plan-feat li::before{content:'✓ ';color:var(--teal)}
.cycle-toggle{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin:16px auto;width:fit-content}
.cycle-btn{padding:10px 24px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.cycle-btn.active{background:var(--teal);color:#07112B}
.btn-checkout{width:100%;background:var(--teal);color:#07112B;font-weight:700;font-size:16px;padding:16px;border:none;border-radius:14px;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-checkout:hover{background:#00C8EB}
.btn-checkout:disabled{opacity:.4;cursor:not-allowed}
/* ===== TRIAL BANNER ===== */
.trial-banner{background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:14px;margin:0 20px 16px;box-shadow:0 4px 20px rgba(220,38,38,.25);animation:fadeIn .3s ease-out}
.trial-banner .trial-text{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.trial-banner .trial-days{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:8px;font-weight:800;font-size:15px;min-width:28px;text-align:center}
.trial-banner .btn-upgrade{background:#fff;color:#DC2626;font-weight:700;font-size:13px;padding:10px 22px;border:none;border-radius:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.trial-banner .btn-upgrade:hover{background:#FEE2E2;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
@media(max-width:540px){.trial-banner{flex-direction:column;text-align:center}}
/* ===== SETTINGS PANEL ===== */
.settings-overlay{position:fixed;inset:0;background:rgba(4,11,30,.82);backdrop-filter:blur(6px);z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.settings-card{width:100%;max-width:520px;border-radius:24px;overflow:clip;margin:auto}
.settings-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.settings-body{padding:24px;display:flex;flex-direction:column;gap:18px}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;border:1px solid var(--border)}
.user-email{font-size:14px;font-weight:600}
.user-role{font-size:12px;color:var(--text-dim)}
.btn-remove-user{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:6px 10px;border-radius:8px;transition:all .2s}
.btn-remove-user:hover{background:rgba(239,68,68,.1)}

// ─── HELPERS ─────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n);
const fmtDate = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}); };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/(864e5));
const daysFromNow = s => Math.ceil((new Date(s+' 00:00:00')-new Date())/(864e5));

const esc=(s)=>{if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');};
const sanitizeEmail=(e)=>e.replace(/[\u200f\u200e\u202a\u202b\u202c\u200b\u00a0\ufeff]/g,'').trim().toLowerCase();

const matchesSearch=(t,q)=>{ const lq=q.toLowerCase(); const bankName=t.bank_id&&tenantBanks.length>0?bankDisplayName(tenantBanks.find(b=>b.id===t.bank_id)||{bank_name:''}).toLowerCase():''; return (t.description||'').toLowerCase().includes(lq)||(t.vendor||'').toLowerCase().includes(lq)||String(t.amount).includes(lq)||bankName.includes(lq); };

// Tenant type helpers — DB only allows plan='starter'/'pro' and billing_cycle='monthly'/'yearly'
// We identify trial/free by expiry date: free=2090+, trial=short expiry with no payment logic
function isFreeAccount(t){ return t && t.plan_expires_at && new Date(t.plan_expires_at).getFullYear()>=2090; }
function isTrialAccount(t){ return t && !isFreeAccount(t) && t.plan==='starter' && t.plan_expires_at && (new Date(t.plan_expires_at)-new Date(t.plan_started_at||t.created_at))/(864e5)<=8; }

// Bank info helpers — store structured data in bank_name as JSON
function parseBankInfo(b) {
  try { const d=JSON.parse(b.bank_name); return {name:d.name||'',bank:d.bank||'',branch:d.branch||'',account:d.account||'',balance:parseFloat(b.balance||0),id:b.id}; }
  catch(e){ return {name:b.bank_name||'',bank:'',branch:'',account:'',balance:parseFloat(b.balance||0),id:b.id}; }
}
function bankDisplayName(b){ const i=parseBankInfo(b); return i.name||(i.bank?i.bank+' '+i.branch:'חשבון'); }
function bankSubtitle(b){ const i=parseBankInfo(b); const parts=[]; if(i.bank)parts.push(i.bank); if(i.branch)parts.push('סניף '+i.branch); if(i.account)parts.push('ח-ן '+i.account); return parts.join(' · '); }

function calcZeroDate(txs, bal) {
  let run = bal;
  const sorted = [...txs].filter(t=>!t.is_completed).sort((a,b)=>a.date.localeCompare(b.date));
  for(const t of sorted){
    run += t.type==='income' ? +t.amount : -t.amount;
    if(run<=0) return t.date;
  }
  return null;
}

function futureWithBalance(txs, bal) {
  // Compute per-bank running balances + unified running balance
  const bankBals = {};
  tenantBanks.forEach(b=>{ bankBals[b.id] = parseFloat(b.balance||0); });
  let totalRun = tenantBanks.length>0 ? tenantBanks.reduce((s,b)=>s+parseFloat(b.balance||0),0) : bal;
  return txs.filter(t=>!t.is_completed).sort((a,b)=>a.date.localeCompare(b.date)||(a.id>b.id?1:-1)).map(t=>{
    const delta = t.type==='income' ? +t.amount : -t.amount;
    totalRun += delta;
    let bankRunning = null;
    if(t.bank_id && bankBals[t.bank_id] !== undefined){
      bankBals[t.bank_id] += delta;
      bankRunning = bankBals[t.bank_id];
    }
    return {...t, runningBalance: totalRun, bankBalance: bankRunning};
  });
}

  `;
  bindDashboard(future, completed, zeroDate);
}

// ─── TABLES ──────────────────────────────────────────

  const totalPages = Math.ceil(future.length / PAGE_SIZE) || 1;

  const pageItems = future.slice(start, start+PAGE_SIZE);
  return `<div class="table-card glass">
    <div class="table-header">
      <div class="table-title">📋 תנועות עתידיות</div>
      <div class="table-count">${future.length} תנועות</div>
    </div>
    ${future.length===0?`<div class="empty-state">אין תנועות עתידיות מתוכננות</div>`:`
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>
        <th></th><th>תיאור</th><th>ספק</th><th>סכום</th><th>תאריך</th><th>סוג</th>${tenantBanks.length>0?'<th>בנק</th><th>יתרה בחשבון</th>':''}<th>יתרה ${tenantBanks.length>0?'מאוחדת':'צפויה'}</th><th></th>
      </tr></thead>
      <tbody>
      ${pageItems.map(t=>`
        <tr class="tx-row${selectedTxId===t.id?' selected':''}" data-id="${t.id}">
          <td><button class="check-btn complete-btn" data-id="${t.id}" title="סמן כבוצע"></button></td>
          <td><span style="font-weight:600">${esc(t.description)}</span>${t.is_recurring?` <span class="badge badge-recurring">חוזרת</span>`:''}</td>
          <td class="td-dim">${esc(t.vendor)||'—'}</td>
          <td><span style="font-weight:700;color:${t.type==='income'?'var(--green)':'var(--orange)'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</span></td>
          <td class="td-dim" style="white-space:nowrap;font-size:13px">${fmtDate(t.date)}</td>
          <td><span class="badge ${t.type==='income'?'badge-income':'badge-expense'}">${t.type==='income'?'הכנסה':'הוצאה'}</span></td>
          ${tenantBanks.length>0?`<td class="td-dim" style="font-size:13px">${t.bank_id?bankDisplayName(tenantBanks.find(b=>b.id===t.bank_id)||{bank_name:''}):'—'}</td><td><span class="${t.bankBalance!==null?(t.bankBalance<0?'bal-neg':'bal-pos'):'bal-pos'}">${t.bankBalance!==null?fmt(t.bankBalance):'—'}</span></td>`:''}

      `).join('')}
      </tbody>
    </table></div>
    ${totalPages>1?`<div class="pagination">
      <button class="pg-future-prev" ${futurePage<=1?'disabled':''}>← הקודם</button>
      <span class="page-info">עמוד ${futurePage} מתוך ${totalPages}</span>
      <button class="pg-future-next" ${futurePage>=totalPages?'disabled':''}>הבא →</button>
    </div>`:''}
    `}
  </div>`;
}

function renderCompletedTable(completed) {
  const cTotalPages = Math.ceil(completed.length / PAGE_SIZE) || 1;
  if(completedPage > cTotalPages) completedPage = cTotalPages;
  const cStart = (completedPage-1)*PAGE_SIZE;
  const cPageItems = completed.slice(cStart, cStart+PAGE_SIZE);
  return `<div class="table-card glass">
    <div class="table-header">
      <div class="table-title">✅ תנועות שבוצעו</div>
      <div class="table-count">${completed.length} תנועות</div>
    </div>
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr><th>תיאור</th><th>ספק</th><th>סכום</th><th>תאריך</th><th>סוג</th><th></th></tr></thead>
      <tbody>
      ${cPageItems.map(t=>`
        <tr class="tx-row" data-id="${t.id}">
          <td style="opacity:.6">${esc(t.description)}</td>
          <td class="td-dim" style="font-size:13px">${esc(t.vendor)||'—'}</td>

      <button class="pg-completed-prev" ${completedPage<=1?'disabled':''}>← הקודם</button>

      <button class="pg-completed-next" ${completedPage>=cTotalPages?'disabled':''}>הבא →</button>
    </div>`:''}
  </div>`;
}

  const delta = isIncome ? parseFloat(confirmModal.amount) : -parseFloat(confirmModal.amount);
  const bank = confirmModal.bank_id ? tenantBanks.find(b=>b.id===confirmModal.bank_id) : null;
  const newBal = bank ? parseFloat(bank.balance||0) + delta : balance + delta;
  const balLabel = bank ? bankDisplayName(bank) : 'יתרה כללית';
  return `<div class="overlay" id="confirm-overlay">
    <div class="modal glass anim-fade" style="max-width:400px">
      <div class="modal-body" style="gap:10px">
        <div style="text-align:center;font-size:36px">✅</div>
        <div style="text-align:center;font-weight:700;font-size:17px">סימון כבוצע</div>
        <div style="text-align:center;color:var(--text-mid,rgba(255,255,255,.55));font-size:14px;line-height:1.8">
          <strong style="color:var(--text,#fff)">"${esc(confirmModal.name)}"</strong><br/>
          <span style="color:${color};font-weight:700;font-size:16px">${sign}${fmt(confirmModal.amount)}</span>
        </div>
        <div style="text-align:center;color:var(--text,rgba(255,255,255,.7));font-size:14px;margin-top:4px">
          האם ברצונך לעדכן את יתרת ${bank ? bankDisplayName(bank) : 'הבנק'}?
        </div>
        <div style="background:var(--input-bg,rgba(255,255,255,.04));border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text-dim,rgba(255,255,255,.45));text-align:center">
          ${balLabel}: <strong style="color:var(--text,#fff)">${fmt(newBal)}</strong>
        </div>
        <div class="modal-actions" style="margin-top:4px">
          <button class="btn-modal-cancel" id="confirm-no">לא</button>
          <button class="btn-modal-confirm" id="confirm-yes" style="background:var(--teal);color:#07112B">כן, עדכן יתרה</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ─── NOTIFICATION ────────────────────────────────────
function showNotif(oldZeroDate, newZeroDate) {
  const existing = document.getElementById('notif');
  if(existing) existing.remove();
  if(notifTimer) clearTimeout(notifTimer);

  let type, title, sub;
  if(!oldZeroDate&&!newZeroDate){type='teal';title='התנועה נוספה בהצלחה ✓';sub='אין שינוי בתאריך הכניסה למינוס';}
  else if(!oldZeroDate&&newZeroDate){type='orange';title='⚠️ תאריך כניסה למינוס חדש!';sub=`נוסף תאריך: ${fmtDate(newZeroDate)}`;}
  else if(oldZeroDate&&!newZeroDate){type='green';title='🎉 אין יותר צפי למינוס!';sub='כל התנועות העתידיות מאוזנות';}
  else {
    const diff = daysBetween(oldZeroDate, newZeroDate);
    if(diff<0){type='red';title='▲ תאריך המינוס התקרב!';sub=`${Math.abs(diff)} ימים קרוב יותר — ${fmtDate(newZeroDate)}`;}
    else if(diff>0){type='green';title='● תאריך המינוס התרחק';sub=`${diff} ימים יותר רחוק — ${fmtDate(newZeroDate)}`;}
    else{type='teal';title='התנועה נוספה ✓';sub='אין שינוי בתאריך';}
  }

  const colors={teal:'rgba(0,174,204,.2)',green:'rgba(16,185,129,.2)',orange:'rgba(249,115,22,.2)',red:'rgba(239,68,68,.2)'};
  const borders={teal:'rgba(0,174,204,.5)',green:'rgba(16,185,129,.5)',orange:'rgba(249,115,22,.5)',red:'rgba(239,68,68,.5)'};
  const el = document.createElement('div');
  el.id='notif'; el.className='anim-up';
  el.style.cssText=`position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:60;min-width:300px;max-width:460px;border-radius:18px;padding:18px 24px;text-align:center;backdrop-filter:blur(20px);background:${colors[type]};border:1px solid ${borders[type]};box-shadow:0 8px 40px ${colors[type]};cursor:pointer`;
  el.innerHTML=`<div style="font-weight:700;font-size:16px;margin-bottom:4px">${title}</div><div style="color:rgba(255,255,255,.55);font-size:13px">${sub}</div><div style="margin-top:12px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden"><div style="height:3px;border-radius:2px;background:${borders[type]};animation:shrink 5s linear forwards"></div></div>`;
  el.addEventListener('click',()=>el.remove());
  document.body.appendChild(el);
  notifTimer = setTimeout(()=>el.remove(), 5100);
}

  // Search — partial re-render (tables only, no header/hero flicker)

  if(si){

      searchQuery = e.target.value;
      futurePage=1; completedPage=1;
      document.getElementById('search-clear').style.visibility = searchQuery ? 'visible' : 'hidden';
      refreshTables();
      const ni = document.getElementById('search-input');
      if(ni){ ni.focus(); try{ni.setSelectionRange(e.target.selectionStart,e.target.selectionStart);}catch(x){} }
    });
  }
  document.getElementById('search-clear')?.addEventListener('click',()=>{
    searchQuery='';
    const si2=document.getElementById('search-input');
    if(si2) si2.value='';
    document.getElementById('search-clear').style.visibility='hidden';

async function saveBalance() {
  const val = parseFloat(document.getElementById('bal-input')?.value);
  if(isNaN(val)){ alert('אנא הכניסו מספר תקין'); return; }
  await db.from('settings').update({current_balance:val}).eq('tenant_id',currentTenant.id);
  balance=val; editingBalance=false; render();
}

function bindEditCard() {
  document.getElementById('ed-save')?.addEventListener('click', async()=>{
    const id = document.getElementById('ed-save').dataset.id;
    const typeToggle = document.getElementById('ed-type-toggle');
    const type = typeToggle.dataset.type;

      description: document.getElementById('ed-desc').value,

function refreshTables() {
  const future = futureWithBalance(transactions, balance);
  const completed = transactions.filter(t=>t.is_completed).sort((a,b)=>b.completed_at?.localeCompare(a.completed_at||'')||0);
  let fFuture = searchQuery ? future.filter(t=>matchesSearch(t,searchQuery)) : [...future];
  let fCompleted = searchQuery ? completed.filter(t=>matchesSearch(t,searchQuery)) : [...completed];
  if(searchDateFrom){ fFuture=fFuture.filter(t=>t.date>=searchDateFrom); fCompleted=fCompleted.filter(t=>t.date>=searchDateFrom); }
  const ts = document.getElementById('tables-section');
  if(ts){
    ts.innerHTML = renderFutureTable(fFuture) + (fCompleted.length ? renderCompletedTable(fCompleted) : '');
    bindTables();
  }
}

function bindTables() {
  document.querySelectorAll('.tx-row[data-id]').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('.check-btn,.del-btn,.edit-input,.btn-save-sm,.btn-cancel-sm,.type-toggle-btn')) return;
      const id = row.dataset.id;
      selectedTxId = selectedTxId===id ? null : id;
      render();
    });
  });
  document.querySelectorAll('.complete-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const tx = transactions.find(t=>t.id===btn.dataset.id);
      if(!tx) return;
      confirmModal = { type:'complete', id:tx.id, name:tx.description, amount:tx.amount, txType:tx.type, bank_id:tx.bank_id };
      render();
    });
  });
  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const tx = transactions.find(t=>t.id===btn.dataset.id);
      if(!tx) return;
      confirmModal = { type:'delete', id:tx.id, name:tx.description };
      render();
    });
  });
  bindEditCard();
  // Pagination
  document.querySelector('.pg-future-prev')?.addEventListener('click',()=>{ futurePage--; refreshTables(); });
  document.querySelector('.pg-future-next')?.addEventListener('click',()=>{ futurePage++; refreshTables(); });
  document.querySelector('.pg-completed-prev')?.addEventListener('click',()=>{ completedPage--; refreshTables(); });
  document.querySelector('.pg-completed-next')?.addEventListener('click',()=>{ completedPage++; refreshTables(); });
}

function bindConfirmModal() {
  if(!confirmModal) return;
  document.getElementById('confirm-overlay')?.addEventListener('click', e=>{
    if(e.target.id==='confirm-overlay'){ confirmModal=null; render(); }
  });
  if(confirmModal.type==='delete'){
    document.getElementById('confirm-cancel')?.addEventListener('click',()=>{ confirmModal=null; render(); });
    document.getElementById('confirm-ok')?.addEventListener('click', async()=>{
      const id=confirmModal.id; confirmModal=null;
      await db.from('transactions').delete().eq('id',id).eq('tenant_id', currentTenant.id);
      await loadData(); render();
    });
  } else {
    document.getElementById('confirm-no')?.addEventListener('click', async()=>{
      const id=confirmModal.id; confirmModal=null;
      await db.from('transactions').update({is_completed:true,completed_at:new Date().toISOString()}).eq('id',id).eq('tenant_id', currentTenant.id);
      await loadData(); render();
    });
    document.getElementById('confirm-yes')?.addEventListener('click', async()=>{
      const {id,amount,txType,bank_id}=confirmModal; confirmModal=null;
      const delta = txType==='income' ? parseFloat(amount) : -parseFloat(amount);
      const updates = [db.from('transactions').update({is_completed:true,completed_at:new Date().toISOString()}).eq('id',id).eq('tenant_id', currentTenant.id)];
      if(bank_id && tenantBanks.length>0){
        const bank = tenantBanks.find(b=>b.id===bank_id);
        if(bank){ updates.push(db.from('tenant_banks').update({balance:parseFloat(bank.balance||0)+delta}).eq('id',bank_id).eq('tenant_id', currentTenant.id)); }
      } else {
        updates.push(db.from('settings').update({current_balance:balance+delta}).eq('tenant_id',currentTenant.id));
        balance += delta;
      }
      await Promise.all(updates);
      if(tenantBanks.length>0){
        const {data:bnks} = await db.from('tenant_banks').select('*').eq('tenant_id',currentTenant.id).order('display_order');
        tenantBanks = bnks||[];
      }
      await loadData(); render();
    });
  }
}

    const existing = document.querySelector('.months-row');
    if(modalRecurring && !existing){
      const row = document.createElement('div');
      row.className = 'months-row';
      row.innerHTML = `<span style="color:rgba(255,255,255,.45);font-size:13px">מספר חודשים:</span><input class="months-input" id="m-months" type="number" value="12" min="2" max="120"/>`;
      document.getElementById('recurring-toggle').insertAdjacentElement('afterend', row);
    } else if(!modalRecurring && existing){ existing.remove(); }
  });

  document.getElementById('modal-confirm')?.addEventListener('click', async()=>{
    const desc = document.getElementById('m-desc').value.trim();
    const amount = parseFloat(document.getElementById('m-amount').value);
    const date = document.getElementById('m-date').value;
    const vendor = document.getElementById('m-vendor').value.trim();
    const months = modalRecurring ? (parseInt(document.getElementById('m-months')?.value)||12) : 1;
    const errEl = document.getElementById('modal-error');

    if(!desc||!amount||!date||amount<=0){errEl.textContent='אנא מלא תיאור, סכום ותאריך';errEl.style.display='block';return;}
    if(tenantBanks.length>0){
      const bk=document.getElementById('m-bank')?.value;
      if(!bk){errEl.textContent='אנא בחרו חשבון בנק';errEl.style.display='block';return;}
    }
    errEl.style.display='none';

    const oldZeroDate = calcZeroDate(transactions, balance);
    const bankId = document.getElementById('m-bank')?.value || null;
    const base = {description:desc, vendor, amount, date, type:modalType, is_recurring:modalRecurring, tenant_id:currentTenant.id, bank_id:bankId||null};

    if(months>1){
      const {data:first} = await db.from('transactions').insert([base]).select().single();
      const extras = [];
      for(let i=1;i<months;i++){
        const d = new Date(date+'T00:00:00');
        d.setMonth(d.getMonth()+i);
        extras.push({...base, date:d.toISOString().split('T')[0], parent_transaction_id:first.id});
      }
      if(extras.length) await db.from('transactions').insert(extras);
    } else {
      await db.from('transactions').insert([base]);
    }

    await loadData();
    const newZeroDate = calcZeroDate(transactions, balance);
    modalOpen=false; modalRecurring=false; render();
    showNotif(oldZeroDate, newZeroDate);
  });
}

// ─── ANALYTICS VIEW (PRO ONLY) ───────────────────
function getAnalyticsData(futureTxs) {
  const today = new Date();
  const inMonths = new Date(today);
  inMonths.setMonth(inMonths.getMonth() + 12);
  const maxDate = inMonths.toISOString().slice(0,10);
  const todayStr = today.toISOString().slice(0,10);

  // Only future, uncompleted, within 12 months
  let txs = futureTxs.filter(t => !t.is_completed && t.date >= todayStr && t.date <= maxDate);

  // Apply bank filter
  if(analyticsBankFilter){
    txs = txs.filter(t => t.bank_id === analyticsBankFilter);
  }



  // All txs for stat cards (filtered by bank if active)
  let allTxs = futureTxs.filter(t => !t.is_completed && t.date >= todayStr && t.date <= maxDate);
  if(analyticsBankFilter) allTxs = allTxs.filter(t => t.bank_id === analyticsBankFilter);
  const totalIncome = allTxs.filter(t=>t.type==='income').reduce((s,t)=>s+parseFloat(t.amount),0);
  const totalExpense = allTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+parseFloat(t.amount),0);

  // Monthly aggregation for 12 months
  const months = [];
  for(let i=0; i<12; i++){
    const d = new Date(today.getFullYear(), today.getMonth()+i, 1);
    const key = d.toISOString().slice(0,7); // YYYY-MM
    const label = d.toLocaleDateString('he-IL',{month:'short',year:'2-digit'});
    months.push({key, label, income:0, expense:0});
  }
  txs.forEach(t => {
    const mk = t.date.slice(0,7);
    const m = months.find(m=>m.key===mk);
    if(m){
      if(t.type==='income') m.income += parseFloat(t.amount);
      else m.expense += parseFloat(t.amount);
    }
  });

  // Running balance per month (filtered by bank if active)
  let runBal;
  if(analyticsBankFilter){
    const bank = tenantBanks.find(b=>b.id===analyticsBankFilter);
    runBal = bank ? parseFloat(bank.balance||0) : 0;
  } else {
    runBal = tenantBanks.length>0 ? tenantBanks.reduce((s,b)=>s+parseFloat(b.balance||0),0) : balance;
  }
  const balanceByMonth = [];
  let allForBalance = futureTxs.filter(t => !t.is_completed && t.date >= todayStr && t.date <= maxDate);
  if(analyticsBankFilter) allForBalance = allForBalance.filter(t => t.bank_id === analyticsBankFilter);
  for(const mo of months){
    const moTxs = allForBalance.filter(t=>t.date.slice(0,7)===mo.key);
    moTxs.forEach(t=>{
      runBal += t.type==='income' ? parseFloat(t.amount) : -parseFloat(t.amount);
    });
    balanceByMonth.push(runBal);
  }

  // Vendor breakdown (expenses only, filtered by bank if active)
  const vendorMap = {};
  allTxs.filter(t=>t.type==='expense').forEach(t=>{
    const v = t.vendor || 'ללא ספק';
    vendorMap[v] = (vendorMap[v]||0) + parseFloat(t.amount);
  });
  const vendorsSorted = Object.entries(vendorMap).sort((a,b)=>b[1]-a[1]);
  const topVendors = vendorsSorted.slice(0,5);
  const otherSum = vendorsSorted.slice(5).reduce((s,v)=>s+v[1],0);
  if(otherSum>0) topVendors.push(['אחר', otherSum]);

  return { txs, allTxs, totalIncome, totalExpense, months, balanceByMonth, topVendors, txCount: allTxs.length };
}

function renderAnalyticsView(futureTxs) {
  const d = getAnalyticsData(futureTxs);
  const projectedBal = (tenantBanks.length>0 ? tenantBanks.reduce((s,b)=>s+parseFloat(b.balance||0),0) : balance) + d.totalIncome - d.totalExpense;

  if(d.allTxs.length === 0){

function openAnalyticsDrill(type, futureTxs) {
  const today = new Date();
  const inMonths = new Date(today);
  inMonths.setMonth(inMonths.getMonth() + 12);
  const maxDate = inMonths.toISOString().slice(0,10);
  const todayStr = today.toISOString().slice(0,10);
  const allTxs = futureTxs.filter(t => !t.is_completed && t.date >= todayStr && t.date <= maxDate);

  let filtered = allTxs;
  let title = '';
  if(type === 'income'){
    filtered = allTxs.filter(t => t.type === 'income');
    title = '📈 הכנסות צפויות — 12 חודשים קדימה';
  } else if(type === 'expense'){
    filtered = allTxs.filter(t => t.type === 'expense');
    title = '📉 הוצאות צפויות — 12 חודשים קדימה';
  }

  const total = filtered.reduce((s,t) => s + parseFloat(t.amount), 0);

  const rows = filtered.sort((a,b) => a.date.localeCompare(b.date)).map(t => `
    <tr>
      <td style="font-weight:600">${esc(t.description)}</td>
      <td style="color:var(--text-dim)">${esc(t.vendor)||'—'}</td>
      <td style="font-weight:700;color:${t.type==='income'?'var(--green)':'var(--orange)'}">${fmt(t.amount)}</td>
      <td style="white-space:nowrap;color:var(--text-dim)">${fmtDate(t.date)}</td>
      ${tenantBanks.length>0?'<td style="color:var(--text-dim);font-size:12px">'+bankDisplayName(tenantBanks.find(b=>b.id===t.bank_id)||{bank_name:''})+'</td>':''}
    </tr>
  `).join('');

  const html = `<div class="drill-overlay" id="drill-overlay">
    <div class="drill-card glass">
      <div class="drill-header">
        <div class="drill-title">${title}</div>
        <button class="drill-close" id="drill-close">✕</button>
      </div>
      <div class="drill-total">סה"כ: <strong>${fmt(total)}</strong> · ${filtered.length} תנועות</div>
      <div class="drill-list">
        <table>
          <thead><tr>
            <th>תיאור</th><th>ספק</th><th>סכום</th><th>תאריך</th>${tenantBanks.length>0?'<th>בנק</th>':''}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  </div>`;

  // Insert into DOM without full re-render
  const el = document.createElement('div');
  el.innerHTML = html;
  document.body.appendChild(el.firstElementChild);

  const overlay = document.getElementById('drill-overlay');
  const close = () => { overlay?.remove(); };
  document.getElementById('drill-close')?.addEventListener('click', close);
  overlay?.addEventListener('click', e => { if(e.target === overlay) close(); });
}

function initAnalyticsCharts(futureTxs) {
  if(activeView !== 'analytics' || !currentTenant || currentTenant.plan !== 'pro') return;
  if(typeof Chart === 'undefined') return; // Chart.js not loaded yet
  const d = getAnalyticsData(futureTxs);
  if(d.allTxs.length === 0) return;

  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const gridColor = isLight ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.07)';
  const labelColor = isLight ? '#666' : 'rgba(255,255,255,.5)';
  const tooltipBg = isLight ? '#fff' : '#1a2744';
  const tooltipText = isLight ? '#333' : '#fff';
  const tooltipBorder = isLight ? 'rgba(0,0,0,.1)' : 'rgba(255,255,255,.1)';

  const commonScales = {
    x:{grid:{display:false},ticks:{color:labelColor,font:{size:11}}},
    y:{grid:{color:gridColor},ticks:{color:labelColor,font:{size:11},callback:v=>fmt(v)},beginAtZero:false}
  };
  const commonTooltip = {
    backgroundColor:tooltipBg,titleColor:tooltipText,bodyColor:tooltipText,
    borderColor:tooltipBorder,borderWidth:1,rtl:true,textDirection:'rtl',
    callbacks:{label:ctx=>ctx.dataset.label+': '+fmt(ctx.parsed.y||ctx.parsed||0)}
  };

  // 1. Balance line chart
  const balCtx = document.getElementById('chart-balance');
  if(balCtx){
    const negativePlugin = {
      id:'negativeZone',
      beforeDraw(chart){
        const {ctx:c,chartArea:{top,bottom,left,right},scales:{y}} = chart;
        const zeroY = y.getPixelForValue(0);
        if(zeroY < top || zeroY > bottom) return;
        c.save();
        c.fillStyle = isLight ? 'rgba(239,68,68,.06)' : 'rgba(239,68,68,.08)';
        c.fillRect(left, zeroY, right-left, bottom-zeroY);
        c.restore();
      }
    };
    new Chart(balCtx, {
      type:'line',
      data:{
        labels: d.months.map(m=>m.label),
        datasets:[{
          label:'יתרה צפויה',
          data: d.balanceByMonth,
          borderColor:'#00AECC',
          backgroundColor:'rgba(0,174,204,.1)',
          fill:true,
          tension:.3,
          pointRadius:4,
          pointBackgroundColor:'#00AECC',
          pointHoverRadius:6
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:commonTooltip},
        scales:commonScales
      },
      plugins:[negativePlugin]
    });
  }

  // 2. Bar chart
  const barCtx = document.getElementById('chart-bars');
  if(barCtx){
    const datasets = [
      {label:'הכנסות',data:d.months.map(m=>m.income),backgroundColor:isLight?'rgba(34,139,34,.65)':'rgba(16,185,129,.65)',borderRadius:4,barPercentage:.6},
      {label:'הוצאות',data:d.months.map(m=>m.expense),backgroundColor:isLight?'rgba(220,80,60,.55)':'rgba(251,146,60,.55)',borderRadius:4,barPercentage:.6}
    ];
    new Chart(barCtx, {
      type:'bar',
      data:{labels:d.months.map(m=>m.label),datasets},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:labelColor,font:{size:12},usePointStyle:true,pointStyle:'rectRounded'},rtl:true},tooltip:commonTooltip},
        scales:{...commonScales,y:{...commonScales.y,beginAtZero:true}}
      }
    });
  }

  // 3. Pie chart (only if not filtering income)
  const pieCtx = document.getElementById('chart-pie');
  if(pieCtx && d.topVendors.length > 0){
    const pieColors = ['#00AECC','#10B981','#F59E0B','#8B5CF6','#EC4899','#94A3B8'];
    new Chart(pieCtx, {
      type:'doughnut',
      data:{
        labels:d.topVendors.map(v=>v[0]),
        datasets:[{data:d.topVendors.map(v=>v[1]),backgroundColor:pieColors.slice(0,d.topVendors.length),borderWidth:0,hoverOffset:8}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        cutout:'55%',
        plugins:{
          legend:{position:'bottom',rtl:true,labels:{color:labelColor,font:{size:11},usePointStyle:true,pointStyle:'circle',padding:12}},
          tooltip:{...commonTooltip,callbacks:{label:ctx=>ctx.label+': '+fmt(ctx.parsed)+' ('+Math.round(ctx.parsed/d.topVendors.reduce((s,v)=>s+v[1],0)*100)+'%)'}}
        }
      }
    });
  }
}

async function activateAccount() {
  const pending = JSON.parse(localStorage.getItem('tazrim_pending')||'{}');
  if(!pending.email) return;
  const plan = pending.plan||'starter';
  const cycle = pending.cycle||'monthly';
  const now = new Date();
  const expires = new Date(now);
  if(cycle==='yearly') expires.setFullYear(expires.getFullYear()+1);
  else expires.setMonth(expires.getMonth()+1);

  // Create tenant
  const {data:tenant,error:tErr} = await db.from('tenants').insert([{
    owner_email: pending.email,
    plan, billing_cycle: cycle,
    plan_expires_at: expires.toISOString(),
    is_active: true
  }]).select().single();

  if(tErr){console.error('tenant create error',tErr);alert('שגיאה ביצירת חשבון');return;}

  // Add owner as tenant user
  await db.from('tenant_users').insert([{
    tenant_id: tenant.id, email: pending.email, role:'owner', accepted_at: now.toISOString()
  }]);

  // Create default settings for this tenant
  await db.from('settings').insert([{tenant_id: tenant.id, current_balance:0}]);

  // Log payment
  const prices = {starter:{monthly:12,yearly:120},pro:{monthly:36,yearly:360}};
  await db.from('payments').insert([{
    tenant_id: tenant.id,
    amount: prices[plan][cycle],
    plan, billing_cycle: cycle,
    status:'completed',
    period_start: now.toISOString().split('T')[0],
    period_end: expires.toISOString().split('T')[0]
  }]);

  // Send welcome email via Resend
  try {
    await fetch('https://api.resend.com/emails', {
      method:'POST',
      headers:{'Authorization':'Bearer '+RESEND_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({
        from:'תזרים <noreply@tactigo.co.il>',
        to:[pending.email],
        subject:'ברוכים הבאים לתזרים!',
        html: welcomeEmailHTML(pending.email, plan)
      })
    });
    // Log email
    await db.from('email_log').insert([{tenant_id:tenant.id,to_email:pending.email,template:'welcome'}]);
  } catch(e){console.error('email error',e);}

  localStorage.removeItem('tazrim_pending');
  await loadTenantContext();
  await loadData();
  render();
}

      ? banks.reduce((s,b) => s + parseFloat(b.balance||0), 0)

    const zd = calcZeroDate(txs||[], bal);
    const expired = t.plan_expires_at && new Date(t.plan_expires_at)<new Date();

function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, {defval:''});
        if(!json.length){ reject('הקובץ ריק'); return; }
        if(json.length>500){ reject('מקסימום 500 שורות (נמצאו '+json.length+')'); return; }

        // Map column names (Hebrew + English)
        const colMap = {};
        const headers = Object.keys(json[0]);
        for(const h of headers){
          const lh = h.trim().toLowerCase();
          if(['תיאור','description','desc'].includes(lh)) colMap.description=h;
          else if(['סכום','amount','sum'].includes(lh)) colMap.amount=h;
          else if(['תאריך','date'].includes(lh)) colMap.date=h;
          else if(['סוג','type','kind'].includes(lh)) colMap.type=h;
          else if(['ספק','vendor','supplier'].includes(lh)) colMap.vendor=h;
          else if(['בנק','bank','חשבון'].includes(lh)) colMap.bank=h;
        }

        if(!colMap.description||!colMap.amount||!colMap.date||!colMap.type||!colMap.bank){
          const missing=[];
          if(!colMap.description) missing.push('תיאור');
          if(!colMap.amount) missing.push('סכום');
          if(!colMap.date) missing.push('תאריך');
          if(!colMap.type) missing.push('סוג');
          if(!colMap.bank) missing.push('בנק');
          reject('עמודות חסרות: '+missing.join(', '));
          return;
        }

        // Build bank name → id lookup
        const bankLookup = {};
        tenantBanks.forEach(b=>{
          bankLookup[b.bank_name.trim().toLowerCase()] = b.id;
          // Also try display name
          const dn = bankDisplayName(b).trim().toLowerCase();
          bankLookup[dn] = b.id;
        });

        const rows = json.map(row=>{
          const r = {};
          r.description = String(row[colMap.description]||'').trim();
          r.vendor = colMap.vendor ? String(row[colMap.vendor]||'').trim() : '';
          r._rawType = String(row[colMap.type]||'').trim();
          r._bankName = colMap.bank ? String(row[colMap.bank]||'').trim() : '';

          // Parse amount
          let amt = row[colMap.amount];
          if(typeof amt==='string') amt = parseFloat(amt.replace(/[^0-9.\-]/g,''));
          r.amount = parseFloat(amt);

          // Parse type
          const rawType = r._rawType.toLowerCase();
          if(['הכנסה','income','in','+'].includes(rawType)) r.type='income';
          else if(['הוצאה','expense','out','-'].includes(rawType)) r.type='expense';
          else r.type='';

          // Parse date
          let dateVal = row[colMap.date];
          if(dateVal instanceof Date){
            r.date = dateVal.toISOString().split('T')[0];
          } else {
            const ds = String(dateVal).trim();
            // Try dd/mm/yyyy
            const ddmm = ds.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
            if(ddmm) r.date = ddmm[3]+'-'+ddmm[2].padStart(2,'0')+'-'+ddmm[1].padStart(2,'0');
            // Try yyyy-mm-dd
            else if(/^\d{4}-\d{2}-\d{2}$/.test(ds)) r.date = ds;
            else r.date = '';
          }

          // Resolve bank
          const bankKey = r._bankName.toLowerCase();
          r.bank_id = bankLookup[bankKey] || null;

          // Validate
          if(!r.description) r._error='תיאור חסר';
          else if(!r.amount||isNaN(r.amount)||r.amount<=0) r._error='סכום לא תקין';
          else if(!r.date||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)) r._error='תאריך לא תקין';
          else if(!r.type) r._error='סוג לא תקין (הכנסה/הוצאה)';
          else if(!r.bank_id) r._error='בנק לא נמצא: '+r._bankName;
          else r._error=null;

          return r;
        });

        resolve(rows);
      } catch(ex){ reject('שגיאה בקריאת הקובץ: '+ex.message); }
    };
    reader.onerror = ()=> reject('שגיאה בקריאת הקובץ');
    reader.readAsArrayBuffer(file);
  });
}

async function importTransactions(rows) {
  const valid = rows.filter(r=>!r._error);
  if(!valid.length) return;
  const tid = currentTenant.id;
  // Batch insert in chunks of 100
  for(let i=0; i<valid.length; i+=100){
    const batch = valid.slice(i, i+100).map(r=>({
      description: r.description,
      vendor: r.vendor||null,
      amount: r.amount,
      date: r.date,
      type: r.type,
      is_recurring: false,
      tenant_id: tid,
      bank_id: r.bank_id
    }));
    await db.from('transactions').insert(batch);
  }
  await loadData();
}

function bindImportModal() {
  document.getElementById('import-overlay')?.addEventListener('click',e=>{
    if(e.target.id==='import-overlay'){importModalOpen=false;importRows=[];render();}
  });
  document.getElementById('import-cancel')?.addEventListener('click',()=>{importModalOpen=false;importRows=[];render();});
  document.getElementById('import-reset')?.addEventListener('click',()=>{importRows=[];render();});

  // File drop zone
  const zone = document.getElementById('import-drop-zone');
  const fileInput = document.getElementById('import-file-input');
  if(zone){
    zone.addEventListener('click',()=>fileInput.click());
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',async e=>{
      e.preventDefault();zone.classList.remove('drag-over');
      const f=e.dataTransfer.files[0];
      if(f) await handleImportFile(f);
    });
    fileInput?.addEventListener('change',async e=>{
      const f=e.target.files[0];
      if(f) await handleImportFile(f);
    });
  }

  // Confirm import
  document.getElementById('import-confirm')?.addEventListener('click', async()=>{
    const btn=document.getElementById('import-confirm');
    btn.disabled=true; btn.textContent='מייבא...';
    try{
      await importTransactions(importRows);
      importModalOpen=false; importRows=[];
      render();
      showNotification('התנועות יובאו בהצלחה ✓');
    }catch(ex){
      btn.disabled=false; btn.textContent='שגיאה — נסה שוב';
    }
  });
}

async function handleImportFile(file) {
  const zone = document.getElementById('import-drop-zone');
  if(zone) zone.innerHTML='<div style="color:var(--teal)">טוען קובץ...</div>';
  try{
    importRows = await parseExcelFile(file);
    render();
  }catch(err){
    importRows=[];
    if(zone) zone.innerHTML='<div style="color:var(--red)">'+esc(String(err))+'</div><div style="margin-top:8px;font-size:12px;color:var(--text-dim)">לחצו לנסות שוב</div>';
    setTimeout(()=>{render();},2500);
  }
}

    html.setAttribute('data-theme',next);
    localStorage.setItem('tazrim_theme',next);
    const btn=document.getElementById('theme-toggle');
    if(btn) btn.textContent=next==='light'?'☀️':'🌙';
    updateLogos(next);
  });
  // Apply saved theme
  const saved=localStorage.getItem('tazrim_theme');
  if(saved){
    document.documentElement.setAttribute('data-theme',saved);
    const btn=document.getElementById('theme-toggle');
    if(btn) btn.textContent=saved==='light'?'☀️':'🌙';
    updateLogos(saved);
  }
}

// ─── TENANT CONTEXT LOADER ──────────────────────
async function loadTenantContext() {
  if(!session) return;
  const email = session.user.email;
  
  // Check if user has any tenant access
  const {data:tuRows} = await db.from('tenant_users').select('*').eq('email',email).eq('is_active',true);
  
  if(!tuRows || tuRows.length===0){
    // Admin gets auto-tenant (free, no expiration)
    if(email === ADMIN_EMAIL){
      const {data:newT} = await db.from('tenants').insert([{
        owner_email: email, company_name:'Tactigo', plan:'pro', billing_cycle:'yearly',
        plan_expires_at: new Date(2099,11,31).toISOString(), is_active:true
      }]).select().single();
      if(newT){
        await db.from('tenant_users').insert([{tenant_id:newT.id, email, role:'owner', accepted_at:new Date().toISOString()}]);
        await db.from('settings').insert([{tenant_id:newT.id, current_balance:0}]);
        // Re-run to pick up the new tenant
        return await loadTenantContext();
      }
    }
    // Check if user registered as accountant
    // Check if user registered as accountant
    if(localStorage.getItem('tazrim_user_role')==='accountant'){
      userRole='accountant'; currentTenant=null; return;
    }
    currentTenant=null; userRole=null;
    return;
  }
  
  // Check for owner/user role first
  const ownerRow = tuRows.find(r=>r.role==='owner') || tuRows.find(r=>r.role==='user');
  const acctRow = tuRows.find(r=>r.role==='accountant');
  
  if(ownerRow){
    const {data:t} = await db.from('tenants').select('*').eq('id',ownerRow.tenant_id).single();
    currentTenant = t;
    userRole = ownerRow.role;
    // Check expiration (skip for free accounts)
    if(t && !isFreeAccount(t) && t.plan_expires_at && new Date(t.plan_expires_at)<new Date()){
      currentTenant.is_active = false;
    }
    // Load banks for all plans
    if(t){
      const {data:banks} = await db.from('tenant_banks').select('*').eq('tenant_id',t.id).order('display_order',{ascending:true});
      tenantBanks = banks||[];
    }
    await loadTenantUsers();
  } else if(acctRow){
    userRole = 'accountant';
    currentTenant = null;
    localStorage.setItem('tazrim_user_role','accountant'); // persist role
  }
}


// ─── DATA ─────────────────────────────────────────────
async function loadData() {
  if(!currentTenant) return;
  const tid = currentTenant.id;
  const [{data:sets},{data:txs}] = await Promise.all([
    db.from('settings').select('*').eq('tenant_id',tid).single(),
    db.from('transactions').select('*').eq('tenant_id',tid).order('date',{ascending:true})
  ]);
  if(sets) balance = parseFloat(sets.current_balance)||0;
  else balance = 0;
  if(txs) transactions = txs;
  else transactions = [];
}

// ─── INIT ─────────────────────────────────────────────
async function init() {
  try {
    const {data:{session:s}} = await db.auth.getSession();
    session = s;
    if(s){
      await loadTenantContext();
      if(currentTenant && currentTenant.is_active) await loadData();
    }
  } catch(e){ console.error('[INIT] getSession error',e); }
  render();

  db.auth.onAuthStateChange(async(event, sess)=>{
    if(event==='SIGNED_IN'){
      session=sess;
      await loadTenantContext();
      if(currentTenant && currentTenant.is_active) await loadData();
      render();
    } else if(event==='SIGNED_OUT'){
      session=null; currentTenant=null; userRole=null; tenantBanks=[]; tenantUsers=[];
      balance=0; transactions=[];
      render();
    } else if(event==='TOKEN_REFRESHED'){
      session=sess;
    }
  });
}

init();
